spring.application.name=ai-service
server.port=2501
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.ai.model.chat=${AI_PROVIDER:google-genai}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.thinking-level=low
spring.ai.anthropic.chat.model=claude-haiku-5-5
ai.timeout=60s
spring.ai.anthropic.timeout=${ai.timeout}
