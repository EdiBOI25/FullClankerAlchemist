spring.application.name=site.backend
spring.config.import=optional:file:.env[.properties]
spring.ai.model.chat=${AI_PROVIDER:google-genai}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.anthropic.chat.model=claude-haiku-5-5
spring.datasource.url=jdbc:sqlite:alchemist.db?foreign_keys=true
spring.jpa.database-platform=lab.site.backend.config.SqliteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
