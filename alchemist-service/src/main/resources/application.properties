spring.application.name=alchemist-service
server.port=2500
server.forward-headers-strategy=native
spring.web.locale=en
spring.web.locale-resolver=fixed
server.servlet.session.cookie.same-site=strict
logging.level.org.apache.coyote.http11.Http11InputBuffer=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=INFO
logging.level.org.springframework.web.method.HandlerMethod=INFO
management.endpoints.web.exposure.include=health,info,metrics
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:2503/api/v2/spans}
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
alchemist.admin.username=${ADMIN_USERNAME:}
alchemist.admin.password=${ADMIN_PASSWORD:}
spring.ai.model.chat=${AI_PROVIDER:google-genai}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.thinking-level=low
spring.ai.anthropic.chat.model=claude-haiku-5-5
ai.timeout=30s
spring.ai.anthropic.timeout=${ai.timeout}
spring.ai.anthropic.max-retries=0
ai-service.url=${AI_SERVICE_URL:http://localhost:2501}
ai-service.read-timeout=90s
spring.http.clients.connect-timeout=2s
spring.datasource.url=jdbc:sqlite:alchemist.db?foreign_keys=true
spring.datasource.hikari.data-source-properties.transaction_mode=IMMEDIATE
spring.jpa.database-platform=fullclanker.alchemist.config.SqliteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
