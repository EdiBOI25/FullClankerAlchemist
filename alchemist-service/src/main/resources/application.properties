spring.application.name=alchemist-service
server.port=2500
management.endpoints.web.exposure.include=health,info,metrics
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
logging.pattern.correlation=[${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.ai.model.chat=${AI_PROVIDER:google-genai}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.thinking-level=low
spring.ai.anthropic.chat.model=claude-haiku-5-5
ai.timeout=30s
spring.ai.anthropic.timeout=${ai.timeout}
spring.ai.anthropic.max-retries=0
ai-service.url=${AI_SERVICE_URL:http://localhost:2501}
ai-service.read-timeout=90s
spring.http.clients.connect-timeout=2s
spring.datasource.url=jdbc:sqlite:alchemist.db?foreign_keys=true
spring.jpa.database-platform=fullclanker.alchemist.config.SqliteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
