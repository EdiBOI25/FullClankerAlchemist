name: fullclanker-alchemist
services:
  alchemist-service:
    build:
      context: .
      dockerfile: alchemist-service/Dockerfile
    ports:
      - "${ALCHEMIST_PORT:-2500}:2500"
    env_file: .env
    environment:
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    volumes:
      - ${ALCHEMIST_DATA_DIR:-./data}:/data
    depends_on:
      ai-service:
        condition: service_healthy
      zipkin:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:2500/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    env_file: .env
    environment:
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      zipkin:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:2501/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  zipkin:
    image: openzipkin/zipkin
    ports:
      - "2503:9411"
    restart: unless-stopped
