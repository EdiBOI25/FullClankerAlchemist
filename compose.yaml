name: fullclanker-alchemist
services:
  alchemist-service:
    build:
      context: .
      dockerfile: alchemist-service/Dockerfile
    ports:
      - "${ALCHEMIST_PORT:-2500}:2500"
    env_file: .env
    volumes:
      - ${ALCHEMIST_DATA_DIR:-./data}:/data
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:2500/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:2501/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
